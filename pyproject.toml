[project]
name = "whatsapp-chatbot"
version = "0.1.0"
description = "Backend minimo para recibir webhooks de WhatsApp Cloud API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.1.0",
    "fastapi>=0.116.0",
    "google-auth[requests]>=2.35.0",
    "httpx>=0.28.0",
    "uvicorn>=0.35.0",
]

[project.optional-dependencies]
audio = [
    "aiortc==1.14.0",
    "av==16.1.0",
    "numpy>=2.2.6,<3",
]
voice = [
    "websockets>=15.0.1,<17",
]

[dependency-groups]
dev = []
